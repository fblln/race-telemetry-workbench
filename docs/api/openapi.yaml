openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Race Telemetry Query API
  version: 0.1.0
  summary: Local REST API for imported Formula 1 telemetry.
  description: >
    Race Telemetry Query API turns imported FastF1 race data into bounded,
    client-ready HTTP resources for replay, engineering analysis, and
    AI-assisted investigation. The API intentionally exposes compact query and
    analytical surfaces instead of arbitrary SQL or unbounded telemetry dumps.
  license:
    name: GNU General Public License v3.0
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
externalDocs:
  description: Project documentation
  url: https://github.com/fblln/race-telemetry-workbench
servers:
  - url: http://127.0.0.1:5120
    description: Local Aspire-managed Query API
tags:
  - name: Metadata
    description: API discovery and capability metadata.
  - name: Sessions
    description: Imported race sessions, drivers, and lap inventories.
  - name: Laps
    description: Lap-level telemetry, timing summaries, and braking-zone analysis.
  - name: Replay
    description: Bounded replay chunks and contextual overlays for desktop playback.
  - name: Analysis
    description: Compact analytical primitives for race review and AI workflows.
x-tagGroups:
  - name: Product API
    tags: [Metadata, Sessions, Laps, Replay, Analysis]
paths:
  /api/:
    get:
      tags: [Metadata]
      operationId: getApiInfo
      summary: Get API metadata and capability names.
      responses:
        "200":
          description: API metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
  /api/sessions:
    get:
      tags: [Sessions]
      operationId: getSessions
      summary: List imported sessions.
      parameters:
        - $ref: "#/components/parameters/Year"
        - name: event
          in: query
          schema:
            type: string
          description: Optional event-name filter.
        - $ref: "#/components/parameters/SessionType"
      responses:
        "200":
          description: Imported sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/sessions/{sessionId}/drivers:
    get:
      tags: [Sessions]
      operationId: getSessionDrivers
      summary: List drivers for a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session drivers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriversResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/drivers/{driverCode}/laps:
    get:
      tags: [Laps]
      operationId: getDriverLaps
      summary: List laps for one driver in a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/DriverCode"
      responses:
        "200":
          description: Driver laps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapsResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/drivers/{driverCode}/laps/{lapNumber}/telemetry:
    get:
      tags: [Laps]
      operationId: getLapTelemetry
      summary: Get bounded telemetry samples for one lap.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/DriverCode"
        - $ref: "#/components/parameters/LapNumber"
        - $ref: "#/components/parameters/TelemetryChannels"
        - $ref: "#/components/parameters/SampleEvery"
        - $ref: "#/components/parameters/MaxSamples"
      responses:
        "200":
          description: Lap telemetry samples.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapTelemetryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/drivers/{driverCode}/laps/{lapNumber}/story:
    get:
      tags: [Laps]
      operationId: getLapStory
      summary: Get compact lap timing, tyre, telemetry, and insight facts.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/DriverCode"
        - $ref: "#/components/parameters/LapNumber"
      responses:
        "200":
          description: Lap story.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapStoryResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/drivers/{driverCode}/laps/{lapNumber}/braking-zones:
    get:
      tags: [Laps]
      operationId: getLapBrakingZones
      summary: Get contiguous braking windows for one lap.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/DriverCode"
        - $ref: "#/components/parameters/LapNumber"
        - name: brakeThresholdPct
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 80
        - name: minimumDurationMs
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 250
      responses:
        "200":
          description: Braking zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapBrakingZonesResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/compare/laps:
    get:
      tags: [Analysis]
      operationId: compareLaps
      summary: Compare two laps by lap-relative time buckets.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: driverA
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2,4}$"
        - name: lapA
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: driverB
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2,4}$"
        - name: lapB
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/TelemetryChannels"
        - name: timeStepMs
          in: query
          schema:
            type: integer
            minimum: 20
            maximum: 5000
            default: 100
      responses:
        "200":
          description: Lap comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapComparisonResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/compare/laps/story:
    get:
      tags: [Analysis]
      operationId: compareLapsStory
      summary: Get compact comparison facts for two laps.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: driverA
          in: query
          required: true
          schema:
            type: string
        - name: lapA
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: driverB
          in: query
          required: true
          schema:
            type: string
        - name: lapB
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: segmentCount
          in: query
          schema:
            type: integer
            minimum: 2
            maximum: 12
            default: 3
      responses:
        "200":
          description: Lap comparison story.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LapComparisonStoryResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/story:
    get:
      tags: [Analysis]
      operationId: getRaceStory
      summary: Get race-level context and insight facts.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: raceControlLimit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Race story.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceStoryResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/replay/metadata:
    get:
      tags: [Replay]
      operationId: getReplayMetadata
      summary: Get replay bounds, drivers, channels, and available overlays.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Replay metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayMetadata"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/replay/chunk:
    get:
      tags: [Replay]
      operationId: getReplayChunk
      summary: Get bounded replay samples for a session-relative time window.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/FromMs"
        - name: durationMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1000
            maximum: 120000
        - name: drivers
          in: query
          schema:
            type: string
          description: Comma-separated driver codes.
        - name: channels
          in: query
          schema:
            type: string
          description: Comma-separated replay channels.
        - $ref: "#/components/parameters/SampleEvery"
      responses:
        "200":
          description: Replay chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayChunkResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/replay/context:
    get:
      tags: [Replay]
      operationId: getReplayContext
      summary: Get weather, track-status, and race-control context for a time window.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/FromMs"
        - name: durationMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1000
            maximum: 600000
        - name: includeWeather
          in: query
          schema:
            type: boolean
            default: true
        - name: includeTrackStatus
          in: query
          schema:
            type: boolean
            default: true
        - name: includeRaceControl
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Replay context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayContextResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/telemetry/events/search:
    post:
      tags: [Analysis]
      operationId: searchTelemetryEvents
      summary: Search bounded telemetry event candidates.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEventSearchRequest"
      responses:
        "200":
          description: Telemetry event candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryEventSearchResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/telemetry-events/search:
    post:
      tags: [Analysis]
      operationId: searchTelemetryEventsLegacy
      summary: Search bounded telemetry event candidates.
      deprecated: true
      description: >
        Compatibility alias for `/api/sessions/{sessionId}/telemetry/events/search`.
        New clients should use the resource-style telemetry events path.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEventSearchRequest"
      responses:
        "200":
          description: Telemetry event candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryEventSearchResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/telemetry/aggregate:
    post:
      tags: [Analysis]
      operationId: aggregateTelemetry
      summary: Aggregate telemetry metrics without returning raw samples.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryAggregateRequest"
      responses:
        "200":
          description: Aggregated telemetry metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryAggregateResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /api/sessions/{sessionId}/telemetry/windows:
    post:
      tags: [Analysis]
      operationId: detectTelemetryWindows
      summary: Detect contiguous telemetry event intervals.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryWindowRequest"
      responses:
        "200":
          description: Telemetry windows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryWindowResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/sessions/{sessionId}/stints/analyze:
    post:
      tags: [Analysis]
      operationId: analyzeDriverStints
      summary: Analyze stint degradation and lap-time metrics.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StintAnalysisRequest"
      responses:
        "200":
          description: Stint analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StintAnalysisResponse"
  /api/sessions/{sessionId}/pit-stops/analyze:
    post:
      tags: [Analysis]
      operationId: analyzePitStops
      summary: Analyze pit-in and pit-out markers with nearby baselines.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PitStopAnalysisRequest"
      responses:
        "200":
          description: Pit-stop analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitStopAnalysisResponse"
  /api/sessions/{sessionId}/weather/trend:
    post:
      tags: [Analysis]
      operationId: getWeatherTrend
      summary: Summarize weather changes across a session or time window.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeatherTrendRequest"
      responses:
        "200":
          description: Weather trend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherTrendResponse"
  /api/sessions/{sessionId}/race-control/timeline:
    post:
      tags: [Analysis]
      operationId: getRaceControlTimeline
      summary: Filter race-control timeline messages and grouped counts.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaceControlTimelineRequest"
      responses:
        "200":
          description: Race-control timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceControlTimelineResponse"
  /api/sessions/{sessionId}/circuit/context:
    get:
      tags: [Analysis]
      operationId: getCircuitContext
      summary: Get imported circuit rotation, corners, marshal lights, and marshal sectors.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Circuit context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircuitContextResponse"
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Stable imported session identifier in `{year}-{event-slug}-{session-type}` form.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]*$"
      example: 2025-italian-grand-prix-r
    DriverCode:
      name: driverCode
      in: path
      required: true
      description: FIA-style driver abbreviation from the imported FastF1 session.
      schema:
        type: string
        pattern: "^[A-Za-z]{2,4}$"
      example: LEC
    LapNumber:
      name: lapNumber
      in: path
      required: true
      description: 1-based lap number within the imported session.
      schema:
        type: integer
        minimum: 1
      example: 53
    Year:
      name: year
      in: query
      description: Optional season filter.
      schema:
        type: integer
        minimum: 1950
      example: 2025
    SessionType:
      name: sessionType
      in: query
      schema:
        type: string
        x-extensible-enum: [FP1, FP2, FP3, Q, SQ, S, R]
      description: Race sessions use R. Non-race sessions are explicit opt-ins.
    TelemetryChannels:
      name: channels
      in: query
      schema:
        type: string
      description: >
        Comma-separated telemetry channel names. Supported values are
        `speed_kmh`, `throttle_pct`, `brake_pct`, `gear`, `rpm`, `drs`,
        `session_time_ms`, and `lap_time_ms`.
      example: speed_kmh,throttle_pct,brake_pct
    SampleEvery:
      name: sampleEvery
      in: query
      description: Return every Nth sample after query ordering. Use for bounded downsampling.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 1
    MaxSamples:
      name: maxSamples
      in: query
      description: Hard cap for returned telemetry samples.
      schema:
        type: integer
        minimum: 1
        maximum: 50000
        default: 5000
    FromMs:
      name: fromMs
      in: query
      required: true
      description: Session-relative start time in milliseconds.
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          examples:
            invalidDriver:
              summary: Invalid driver code
              value:
                type: https://fblln.github.io/race-telemetry-workbench/problems#invalid-driver
                title: Invalid request
                status: 400
                detail: Driver codes must contain 2 to 4 letters.
                code: InvalidDriver
                errors:
                  driverCode: "123"
    NotFoundError:
      description: The requested session, driver, lap, or comparison does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
          examples:
            missingSession:
              summary: Missing session
              value:
                type: https://fblln.github.io/race-telemetry-workbench/problems#session-not-found
                title: Resource not found
                status: 404
                detail: Session 2025-italian-grand-prix-r does not exist.
                code: SessionNotFound
                errors:
                  sessionId: 2025-italian-grand-prix-r
  schemas:
    ApiInfo:
      type: object
      required: [name, version, capabilities]
      properties:
        name:
          type: string
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
    ApiProblem:
      type: object
      description: RFC 9457-style problem detail with stable machine-readable extensions.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem type URI.
        title:
          type: string
          description: Short human-readable problem category.
        status:
          type: integer
          description: HTTP status code generated by the origin server.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: [string, "null"]
          format: uri-reference
          description: Optional URI reference identifying this occurrence.
        code:
          type: string
          description: Stable application error code for programmatic handling.
        errors:
          type: [object, "null"]
          description: Field or parameter context for validation and lookup failures.
          additionalProperties: true
    SessionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    SessionSummary:
      type: object
      required: [sessionId, year, eventName, sessionType, driverCount, lapCount]
      properties:
        sessionId:
          type: string
        year:
          type: integer
        eventName:
          type: string
        sessionType:
          type: string
        circuitName:
          type: [string, "null"]
        country:
          type: [string, "null"]
        sessionStartUtc:
          type: [string, "null"]
          format: date-time
        driverCount:
          type: integer
        lapCount:
          type: integer
    DriversResponse:
      type: object
      required: [sessionId, items]
      properties:
        sessionId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DriverSummary"
    DriverSummary:
      type: object
      required: [sessionId, driverCode, lapCount]
      properties:
        sessionId:
          type: string
        driverCode:
          type: string
        driverNumber:
          type: [string, "null"]
        fullName:
          type: [string, "null"]
        teamName:
          type: [string, "null"]
        lapCount:
          type: integer
    LapsResponse:
      type: object
      required: [sessionId, driverCode, items]
      properties:
        sessionId:
          type: string
        driverCode:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LapSummary"
    LapSummary:
      type: object
      required: [lapId, sessionId, driverCode, lapNumber, isPitOutLap, isPitInLap]
      properties:
        lapId:
          type: string
        sessionId:
          type: string
        driverCode:
          type: string
        lapNumber:
          type: integer
        lapTimeMs:
          type: [integer, "null"]
          format: int64
        position:
          type: [integer, "null"]
        isPitOutLap:
          type: boolean
        isPitInLap:
          type: boolean
    LapTelemetryResponse:
      type: object
      required: [sessionId, driverCode, lapNumber, channels, items]
      properties:
        sessionId:
          type: string
        driverCode:
          type: string
        lapNumber:
          type: integer
        channels:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/TelemetrySample"
    TelemetrySample:
      type: object
      properties:
        sampleTimeUtc:
          type: string
          format: date-time
        sessionTimeMs:
          type: [integer, "null"]
          format: int64
        lapTimeMs:
          type: [integer, "null"]
          format: int64
        speedKmh:
          type: [number, "null"]
        throttlePct:
          type: [number, "null"]
        brakePct:
          type: [number, "null"]
        gear:
          type: [integer, "null"]
        rpm:
          type: [number, "null"]
        drs:
          type: [integer, "null"]
    LapStoryResponse:
      type: object
      required:
        - sessionId
        - driverCode
        - lapNumber
        - sectorTimesMs
        - telemetrySamples
        - insights
      properties:
        sessionId:
          type: string
        driverCode:
          type: string
        lapNumber:
          type: integer
        lapTimeMs:
          type: [integer, "null"]
          format: int64
          description: Lap time in milliseconds when available.
        sectorTimesMs:
          type: array
          items:
            type: [integer, "null"]
            format: int64
        compound:
          type: [string, "null"]
          example: MEDIUM
        tyreLife:
          type: [integer, "null"]
        peakSpeedKmh:
          type: [number, "null"]
        averageSpeedKmh:
          type: [number, "null"]
        averageThrottlePct:
          type: [number, "null"]
        averageBrakePct:
          type: [number, "null"]
        telemetrySamples:
          type: integer
        insights:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisInsight"
    LapBrakingZonesResponse:
      type: object
      required:
        - sessionId
        - driverCode
        - lapNumber
        - brakeThresholdPct
        - minimumDurationMs
        - items
      properties:
        sessionId:
          type: string
        driverCode:
          type: string
        lapNumber:
          type: integer
        brakeThresholdPct:
          type: integer
        minimumDurationMs:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LapBrakingZone"
    LapBrakingZone:
      type: object
      required: [index, startLapTimeMs, endLapTimeMs, durationMs]
      properties:
        index:
          type: integer
        startLapTimeMs:
          type: integer
          format: int64
        endLapTimeMs:
          type: integer
